<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7566e8">
  <title>StudyFlow 4.0</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <div>
          <h2>StudyFlow</h2>
          <small>Ultimate Student Edition</small>
        </div>
      </div>

      <div class="profile-mini">
        <div class="avatar" id="miniAvatar">🌷</div>
        <div>
          <strong id="miniName">My Study Space</strong>
          <small id="miniLevel">Level 1</small>
        </div>
      </div>

      <nav id="navigation">
        <button class="nav active" data-page="dashboard">🏡 Dashboard</button>
        <button class="nav" data-page="tasks">📝 Tasks</button>
        <button class="nav" data-page="planner">🧠 Smart Planner</button>
        <button class="nav" data-page="timetable">📚 Timetable</button>
        <button class="nav" data-page="calendar">🗓️ Calendar</button>
        <button class="nav" data-page="exams">🎓 Exams</button>
        <button class="nav" data-page="focus">⏱️ Focus Room</button>
        <button class="nav" data-page="flashcards">🃏 Flashcards</button>
        <button class="nav" data-page="quiz">🎯 Quiz Arena</button>
        <button class="nav" data-page="notes">📓 Notebooks</button>
        <button class="nav" data-page="habits">🌱 Habits</button>
        <button class="nav" data-page="pet">🐾 My Pet</button>
        <button class="nav" data-page="shop">🛍️ Reward Shop</button>
        <button class="nav" data-page="sounds">🎧 Focus Sounds</button>
        <button class="nav" data-page="analytics">📊 Reports</button>
        <button class="nav" data-page="achievements">🏆 Achievements</button>
        <button class="nav" data-page="profile">⚙️ Profile & Themes</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="mini-progress">
          <div class="progress-top">
            <span>Today's goals</span>
            <span id="goalSideText">0/0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="goalSideBar"></div>
          </div>
        </div>
        <small>Made for your success ✨</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div>
          <span class="eyebrow">YOUR PERSONAL STUDY SPACE</span>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-right">
          <span class="date-pill" id="todayDate"></span>
          <button class="icon-button" id="quickAdd" title="Add a task">＋</button>
        </div>
      </header>

      <div id="pageContent"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
